<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto | Valhalla System</title><link rel="stylesheet" href="style.css"></head><body><header id="siteHeader"></header><main><section class="pageHero"><div><h1>Contacto</h1><p>Consultanos por servicios, productos, sistemas o retiro de equipos.</p></div></section><section class="light"><div class="contactBox"><div class="contactCard"><h2>Valhalla System</h2><p id="zone"></p><p id="phone"></p><p id="email"></p><a class="btn" id="waBtn">Escribir por WhatsApp</a></div><div class="contactCard"><h2>Consulta rápida</h2><input placeholder="Nombre"><input placeholder="Email"><textarea rows="6" placeholder="Mensaje"></textarea><a class="btn" id="send">Enviar por WhatsApp</a></div></div></section></main><footer id="siteFooter"></footer><script src="data.js"></script><script src="firebase-config.js"></script><script src="site.js"></script><script>window.addEventListener("valhalla-ready",()=>{zone.textContent=D.settings.zone;phone.textContent=D.settings.phone||'WhatsApp a configurar';email.textContent=D.settings.email||'Email a configurar';waBtn.href=WA;send.href=WA;},{once:true});</script></body></html>
