<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda Outlet | Valhalla System</title><link rel="stylesheet" href="style.css"><style>.outletHero{padding:58px 7%;background:linear-gradient(120deg,#03070b,#08233a);border-bottom:1px solid #17344b}.outletHero h1{font-size:clamp(34px,5vw,64px);margin:0 0 10px}.outletHero h1 span{color:var(--p)}.outletPrice{font-size:24px;font-weight:900;color:var(--p);margin:10px 0}.outletTag{display:inline-block;padding:6px 10px;border:1px solid var(--p);border-radius:20px;color:var(--a);font-size:12px;font-weight:800;text-transform:uppercase}.emptyOutlet{padding:35px;border:1px dashed #355064;border-radius:14px;text-align:center;color:#91a5b5}</style></head><body><header id="siteHeader"></header><main><section class="outletHero"><h1>Tienda <span>Outlet</span></h1><p class="lead">Equipos, componentes y oportunidades seleccionadas por Valhalla System.</p></section><section class="light"><h2 class="sectionTitle">Productos Outlet</h2><p class="lead">Usados, reacondicionados y ofertas. Consultá disponibilidad antes de comprar.</p><div class="grid" id="outletGrid"></div></section></main><footer id="siteFooter"></footer><script src="data.js"></script><script src="firebase-config.js"></script><script src="site.js"></script><script>window.addEventListener("valhalla-ready",()=>{const items=D.outlet||[];outletGrid.innerHTML=items.length?items.map(x=>{const photos=Array.isArray(x.images)?x.images.filter(Boolean):[];const cover=photos[0]||x.image||'';return `<article class="card"><div class="pic${cover?' hasPhotos':''}" ${cover?`onclick='openGallery(${JSON.stringify(photos.length?photos:[cover])},0)'`:''}>${cover?`<img class="iconPhoto" src="${cover}" alt="${x.title||'Producto Outlet'}">`:'🏷️'}</div><div class="body"><span class="outletTag">${x.condition||'Outlet'}</span><h3>${x.title||''}</h3><p>${x.text||''}</p>${x.price?`<div class="outletPrice">${x.price}</div>`:''}<a class="more" href="${WA}">Consultar por WhatsApp →</a></div></article>`}).join(''):`<div class="emptyOutlet">Todavía no hay productos publicados en la Tienda Outlet.</div>`;},{once:true});</script></body></html>
